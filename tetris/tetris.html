<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris to go</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="tetris.css" />
    <script type="module" src="index.js" defer></script>
  </head>
  <body>
    <main>
      <section class="game_ground">
        <!-- 그냥 왼쪽에 들어갈 가변 패딩 -->
        <article class="blank"></article>

        <!-- 테트리스 메인 보드 -->
        <article class="game">
          <div class="hold_mino">HOLD</div>
          <div class="board_wing left_wing"></div>
          <div class="main_board"></div>
          <div class="board_wing right_wing"></div>
        </article>

        <!-- 다음 미노 / 점수 / 기타 정보 -->
        <article class="infos">
          <div class="next_minos">
            <div class="next_mino"></div>
            <div class="further_next"></div>
          </div>
          <div class="score_board"></div>
        </article>
      </section>
    </main>
  </body>
</html>
